; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Surfboard Display
src_dir = ./

[env:main_display]
build_src_filter = +<main_display/src/*> -<remote_display/src/*>
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
lib_deps = 
	ESP32Servo @ 3.0.7
	olikraus/U8g2
	jgromes/RadioLib
	lib/RiiWynchDisplay
	lib/RiiWynchInput
	lib/RiiWynchProtocol

monitor_filters = 
    esp32_exception_decoder
    time
# upload_port = /dev/cu.usbserial-0001
# monitor_port = /dev/cu.usbserial-0001

[env:remote_display]
build_src_filter = +<remote_display/src/*> -<main_display/src/*>
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
lib_deps = 
	ESP32Servo @ 3.0.7
	olikraus/U8g2
	jgromes/RadioLib
	lib/RiiWynchDisplay
	lib/RiiWynchInput
	lib/RiiWynchProtocol
# upload_port = /dev/cu.usbserial-3
# monitor_port = /dev/cu.usbserial-3

; Production build configurations (optimized, no debug logging)
[env:main_display_production]
build_src_filter = +<main_display/src/*> -<remote_display/src/*>
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = 
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
    -DNDEBUG
lib_deps = 
	ESP32Servo @ 3.0.7
	olikraus/U8g2
	jgromes/RadioLib
	lib/RiiWynchDisplay
	lib/RiiWynchInput
	lib/RiiWynchProtocol
#upload_port = /dev/cu.usbserial-0001
#monitor_port = /dev/cu.usbserial-0001

